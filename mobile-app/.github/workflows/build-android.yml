name: Build Android APK

on:
  push:
    branches:
      - feat/mobile-app-v2
      - main
    paths:
      - 'mobile-app/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile-app

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile-app/package-lock.json'

      - name: 📥 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📥 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 📥 Install Expo CLI
        run: |
          npm install -g expo-cli@latest eas-cli@latest
          echo "✅ Expo CLI installed"

      - name: 📥 Install dependencies
        run: |
          npm install --legacy-peer-deps
          echo "✅ Dependencies installed"

      - name: 🔍 Verify project
        run: |
          npx expo doctor --check
        continue-on-error: true

      - name: 🏗️ Prebuild Android
        run: |
          npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_INTERACTIVE: '1'

      - name: 🔨 Build APK with Gradle
        working-directory: mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m"'
          JAVA_TOOL_OPTIONS: '-Xmx4096m'

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thaqafatna-android-apk
          path: mobile-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 🎉 Report success
        run: |
          echo "## ✅ تم بناء التطبيق بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 APK جاهز للتنزيل من قسم **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "📱 ثبّت التطبيق على هاتفك مباشرة" >> $GITHUB_STEP_SUMMARY
