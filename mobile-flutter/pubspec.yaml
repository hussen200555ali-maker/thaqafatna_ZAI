name: thaqafatna
description: ثقافتنا - منصة ثقافية تفاعلية عربية (تطبيق Flutter احترافي)
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^18.1.4

  # Network
  dio: ^5.5.0+1
  connectivity_plus: ^7.3.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^2.0.0
  cached_network_image: ^4.0.3
  shimmer: ^4.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # PDF Reader
  syncfusion_flutter_pdfviewer: ^35.1.43

  # Notifications
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.0

  # Utilities
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  path_provider: ^2.1.3
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  intl: ^0.20.3
  timeago: ^3.7.0
  email_validator: ^3.0.0

  # RTL
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

  # دعم RTL
  generate: true
