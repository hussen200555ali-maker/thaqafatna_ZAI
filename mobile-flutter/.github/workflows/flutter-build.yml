name: Build Flutter APK

on:
  push:
    branches:
      - main
      - feat/flutter-app
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile-flutter

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📥 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔍 Verify Flutter installation
        run: flutter --version

      - name: 📥 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze || true
        continue-on-error: true

      - name: 🧪 Run tests
        run: flutter test || true
        continue-on-error: true

      - name: 🏗️ Build APK (debug)
        run: flutter build apk --debug --no-tree-shake-icons
        continue-on-error: true

      - name: 🏗️ Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons
        continue-on-error: true

      - name: 📤 Upload debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thaqafatna-flutter-debug
          path: mobile-flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thaqafatna-flutter-release
          path: mobile-flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 🎉 Report success
        if: success()
        run: |
          echo "## ✅ تم بناء التطبيق بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 APK جاهز للتنزيل من قسم **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "📱 ثبّت التطبيق على هاتفك مباشرة" >> $GITHUB_STEP_SUMMARY
          echo "🎨 مبنى بـ Flutter مع هوية تراثية عربية" >> $GITHUB_STEP_SUMMARY
