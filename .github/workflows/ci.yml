يا عزيزي، هذا تقرير **استثنائي** مرة أخرى. المطور لا يكتفي بالتنفيذ، بل **يكتشف الأخطاء ويصلحها** (خطأ حرف `I` في Backup Codes هو مثال رائع على قيمة الاختبارات التي كتبها في اليوم السابق). إنجاز اليوم الثالث (Backup Codes + التوثيق + إعداد CI) هو عمل مهندس محترف.

الآن، لديك **مهمتان إداريتان بسيطتان جدًا** (لا تحتاجان برمجة) لتوثيق هذا الإنجاز، ثم ننتقل لتوجيه المطور لليوم الرابع.

إليك ما يجب أن تفعله بالضبط:

---

### 🛠️ المهمة الأولى لك (أنت): رفع ملف GitHub Actions
المطور لم يستطع رفع ملف الـ CI/CD لأن صلاحيات حسابه (PAT) لا تسمح بذلك. **هذا شيء بسيط جدًا يمكنك فعله في دقيقتين:**
1. اطلب من المطور أن **يُرسل لك محتوى ملف `ci.yml`** (انسخه والصقه في المحادثة هنا).
2. اذهب إلى مستودعك على GitHub: `github.com/hussen200555ali-maker/thaqafatna_ZAI`
3. اضغط على تبويب **Actions** في الأعلى.
4. اضغط على **set up a workflow yourself** (أو "إعداد سير عمل بنفسك").
5. سيفتح لك محرر نصوص. **احذف أي كود موجود**، ثم **الصق الكود** الذي أرسله لك المطور.
6. في الأعلى، أعد تسمية الملف من `main.yml` إلى `ci.yml`.
7. اضغط على زر **Commit changes** (حفظ التغييرات) باللون الأخضر.

---

### 🛡️ المهمة الثانية لك: تفعيل حماية الفرع (Branch Protection)
بمجرد أن يعمل الـ CI، يجب أن نمنع أي شخص (بما فيهم "الخبير") من رفع كود لا يجتاز الاختبارات.
1. اذهب إلى إعدادات المستودع: **Settings** -> **Branches**.
2. اضغط على **Add branch protection rule** (أو "Add classic branch protection rule").
3. في خانة `Branch name pattern` اكتب: **`main`**.
4. فعل الخيار: **Require a pull request before merging** (يتطلب طلب سحب قبل الدمج).
5. فعل الخيار: **Require status checks to pass before merging** (يتطلب نجاح الفحوصات قبل الدمج).
6. في مربع البحث الذي سيظهر، ابحث عن أسماء الفحوصات (مثل `test`, `build`, `e2e`) واخترها.
7. اضغط **Create** (أو حفظ).

---

### 📝 الرسالة التي سترسلها للمطور الآن (اليوم الرابع)

> **إلى كبير المطورين،**
>
> تقرير اليوم الثالث **مذهل**. إنجاز Backup Codes بالكامل (منطق + APIs + واجهة + دمج في auth) مع 18 اختبارًا جديدًا، واكتشافك لخطأ حرف `I` يثبت أن الاستثمار في الاختبارات كان قرارًا صحيحًا. التوثيق (`API.md` و `ADMIN_GUIDE.md`) سيكون سلاحنا للتدريب والإطلاق.
>
> **بخصوص ملف `ci.yml`:** لا تقلق بشأن صلاحيات PAT. **أرسل لي محتوى الملف نصيًا هنا**، وسأقوم برفعه يدويًا عبر واجهة GitHub في دقيقة واحدة.
>
> **ننتقل الآن إلى اليوم الرابع (الأولويات D و E):**
>
> **المهمة 1: تجهيز UAT (D) (نصف يوم):**
> *   أنشئ `scripts/seed-test-users.ts`: يولّد 4 حسابات اختبار (admin, librarian, assistant, reader) بكلمات مرور معروفة.
> *   أنشئ `scripts/seed-demo-content.ts`: يضيف 10 كتب تجريبية، 5 مراجعات معلقة، و3 رسائل تواصل.
> *   أنشئ ملف `UAT_SCENARIOS.md`: يحتوي على الـ 15 سيناريو الذي ذكرته لك سابقًا (خطوات + النتيجة المتوقعة)، ليكون جاهزًا لتجربة المستخدمين.
>
> **المهمة 2: إمكانية الوصول WCAG AA (E) (يوم ونصف):**
> *   **التباين:** راجع الألوان في `globals.css` وتأكد أن نصوص المحتوى (مثل الرمادي الفاتح) تباينها لا يقل عن 4.5:1. (استخدم أداة WebAIM).
> *   **ARIA:** أضف `aria-label` لكل زر يحتوي على أيقونة فقط (مثل أزرار الحذف، الإغلاق، القوائم المنسدلة).
> *   **التنقل بالكيبورد:** تأكد أن الـ Modals (مثل تأكيد الحذف) يمكن إغلاقها بزر `Esc`، وأن الـ Focus ينتقل للعناصر بشكل صحيح.
> *   **Skip to content:** أضف رابطًا مخفيًا في أعلى الصفحة يظهر عند الضغط على `Tab` لنقل المستخدم مباشرة إلى المحتوى (لتجاوز القائمة الجانبية).
>
> **معايير القبول:**
> *   سكربتات الـ Seed تعمل وتنشئ البيانات.
> *   ملف `UAT_SCENARIOS.md` جاهز.
> *   تعديلات WCAG مطبقة (أرسل لقطة شاشة لأداة فحص التباين تثبت نجاح الألوان).
>
> **هذا هو الأسبوع الأخير من Sprint 5. بعد إغلاق D و E، سندخل في مرحلة الإطلاق الرسمي.**
>
> أرسل لي محتوى `ci.yml` أولًا، ثم تقرير اليوم الرابع. 🚀

---

**الخلاصة:** المطور في أفضل حالاته. أنت الآن تقوم بدور "مدير المنتج" (Product Owner) الذي يسهّل العمليات الإدارية (مثل رفع الـ CI وتفعيل الحماية) ليبقى المطور مركزًا على الكود. **خطوتان بسيطتان منك، ثم ننطلق لليوم الرابع.**
